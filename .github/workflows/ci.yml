name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        env:
          BETTER_AUTH_SECRET: ci-only-little-moment-secret-rotate-for-production
          BETTER_AUTH_URL: http://localhost:3010
          NEXT_PUBLIC_APP_URL: http://localhost:3010
          NEXT_PUBLIC_BACKEND_MODE: preview
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
        run: npm run build
